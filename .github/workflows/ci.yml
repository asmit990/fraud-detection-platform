name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.package.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - name: auth-service
            path: services/auth-service
            test: true
          - name: transaction-service
            path: services/transaction-service
            test: true
          - name: fraud-service
            path: services/fraud-service
            test: true
          - name: alert-service
            path: services/alert-service
            test: true
          - name: analytics-service
            path: services/analytics-service
            test: false
          - name: frontend
            path: frontend
            test: false

    defaults:
      run:
        working-directory: ${{ matrix.package.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package.path }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        if: matrix.package.test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: echo "All checks passed. Add deployment steps here."
